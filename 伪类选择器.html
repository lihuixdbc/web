<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伪类选择器</title>
    <style>
        /* 选择所有未访问的链接 a:link */
        a:link {
            color: #000;
            text-decoration: none;
        }

        /* a:visited 选中过得或者访问过得链接 */

        a:visited {
            color: orange;
        }

        /* a:hover 选择鼠标经过的链接 */
        a:hover {
            color: skyblue;
        }

        /* a:active 选择是我们鼠标正在按下还没有弹起的文字 */
        a:active {
            color: green;
        }
    </style>
</head>

<body>
    <a href="#">小猪佩奇</a>
</body>

</html>
