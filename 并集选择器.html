<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>并集选择器</title>
    <style>
        /* 请将熊大、熊二选出来改为粉色 */
        /* div,
        p {
            color: pink;
        } */
        /* 请将熊大熊二变成红色，佩奇家的一家改为红色 */
        div,
        p,
        span,
        .pig li {
            color: pink;
        }

        /* 约定的语法规范，我们并集选择器喜欢竖着写 */
        /* 一定要注意最后把一个选择器不加逗号 */
    </style>


</head>

<body>
    <div>熊大</div>
    <p>熊二</p>
    <span>光头强</span>
    <ul class="pig">
        <li>小猪佩奇</li>
        <li>猪爸爸</li>
        <li>猪妈妈</li>
    </ul>




</body>

</html>
